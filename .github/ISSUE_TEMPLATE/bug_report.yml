name: Bug report
description: Tell us about something that is not working
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Belo. Please share enough detail for someone else to reproduce the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you saw.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that cause the problem.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Tell us what you expected Belo to do instead.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - iPhone
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Use the version shown in the app or near the start of the README developer guide.
      placeholder: "0.4.3"
    validations:
      required: true

  - type: dropdown
    id: project-involved
    attributes:
      label: Is a .belo project involved?
      description: Choose yes if the problem happens while creating, opening, saving, training, or using a project.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots or a screen recording if they help explain the problem. You can drag files into this box.
