name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea for Belo. Start with the problem so we can understand who the change would help.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what is difficult or missing today and when you encounter it.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Belo to solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any other solutions or workarounds you have tried or considered.
