<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="belo-mark-title belo-mark-desc">
  <title id="belo-mark-title">Belo</title>
  <desc id="belo-mark-desc">A yellow square with a thick black border, a bold black ring in the upper left and a pink square offset over its lower right.</desc>

  <!--
    Canonical Belo mark. One geometry, used by the in-app brand marks and by
    every generated platform icon (scripts/make-icon.mjs rasterizes exactly
    these numbers). Neobrutalist: flat opaque color, thick ink strokes, hard
    edges, no gradients, no transparency, no blur.

    Grid: 512. Border 40 wide, so the live field runs 40..472.
    Ring and chip both keep a 28 gap to that field edge.
  -->

  <g id="belo-mark">
    <!-- Yellow field. Opaque edge to edge so iOS icons need no alpha. -->
    <rect width="512" height="512" fill="#ffd83d" />

    <!-- Lens: the thing the classifier looks through. Outer 68..364. -->
    <circle cx="216" cy="216" r="116" fill="none" stroke="#111014" stroke-width="64" />

    <!-- Offset chip: the labeled sample, sitting on top of the lens. -->
    <rect x="302" y="302" width="132" height="132" fill="#ff5c8a" stroke="#111014" stroke-width="20" />

    <!-- Ink frame, drawn last so nothing crosses it. -->
    <rect x="20" y="20" width="472" height="472" fill="none" stroke="#111014" stroke-width="40" />
  </g>
</svg>
