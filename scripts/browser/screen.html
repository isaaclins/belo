<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Belo screen source check</title>
    <style>
      /* The two rules the stage geometry depends on, copied from app.css so the
         check measures the same letterboxing the app renders. */
      #stage {
        position: relative;
        width: 480px;
        height: 480px;
        background: #111014;
      }
      #stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #mount {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="mount"></div></div>
    <script type="module" src="./screen.tsx"></script>
  </body>
</html>
