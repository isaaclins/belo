[package]
name = "belo"
version = "0.4.3"
description = "Train and use image classifiers locally"
authors = ["Belo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "belo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-fs = "2"

[package.metadata.android]
app-permissions = ["android.permission.CAMERA"]

# swift-rs 1.0.7 lets SwiftPM select macOS after the iOS SDK on Xcode 27.
# This local patch selects the iOS triple explicitly until the upstream crate does.
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
